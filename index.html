<!DOCTYPE html>
<html>
<head>
    <title>Water Quality Monitoring</title>

    <style>
        body {
            font-family: Arial;
            background: #e6f7ff;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 80%;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            background: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        h3 {
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Smart Water Contamination Alert System</h2>

    <p>Enter Water Quality Values</p>

    <form method="POST">

        <input type="number" step="any"
        name="ph" placeholder="Enter pH Value" required>

        <br>

        <input type="number" step="any"
        name="turbidity" placeholder="Enter Turbidity" required>

        <br><br>

        <button type="submit">Check Water Quality</button>

    </form>

    {% if result %}
        <h3>{{ result }}</h3>
    {% endif %}

</div>

</body>
</html>
